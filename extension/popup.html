<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EatWhat · 问膳扩展</title>
  <style>
    :root {
      --eatwhat-main: #2d6a4f;
      --eatwhat-alert: #c0392b;
      --eatwhat-bg: #f8f9fa;
      --eatwhat-text: #1f2937;
    }

    body {
      margin: 0;
      min-width: 300px;
      background: var(--eatwhat-bg);
      color: var(--eatwhat-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .eatwhat-wrap {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eatwhat-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .eatwhat-subtitle {
      margin: 0;
      font-size: 12px;
      color: #6b7280;
    }

    .eatwhat-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--eatwhat-main);
      cursor: pointer;
    }

    .eatwhat-btn:hover {
      background: #25583f;
    }

    .eatwhat-status {
      min-height: 18px;
      font-size: 12px;
    }

    .eatwhat-status-info {
      color: #4b5563;
    }

    .eatwhat-status-success {
      color: var(--eatwhat-main);
    }

    .eatwhat-status-error {
      color: var(--eatwhat-alert);
    }
  </style>
</head>
<body>
  <div class="eatwhat-wrap">
    <h1 class="eatwhat-title">🍽️ 问膳 EatWhat</h1>
    <p class="eatwhat-subtitle">当前页一键采集并上报到 /ingest</p>
    <button id="collect-button" class="eatwhat-btn" type="button">采集本视频</button>
    <p id="status" class="eatwhat-status eatwhat-status-info">等待操作</p>
    <p class="eatwhat-subtitle">右键视频链接也可直接“存入冷静期盒子”</p>
  </div>

  <script src="logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
