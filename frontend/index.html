<!DOCTYPE html>
<html lang="zh-CN" data-theme="pastel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EatWhat · 问膳</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.13/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/css/eatwhat.css">
</head>
<body class="eatwhat-page">
  <header class="navbar border-b border-base-200 bg-base-100/95 px-4 shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between">
      <a class="btn btn-ghost px-1 text-xl font-semibold normal-case" href="/">
        <span class="text-2xl">🍽️</span>
        <span>问膳 EatWhat</span>
      </a>
      <nav class="hidden gap-2 md:flex">
        <a href="index.html" class="btn btn-sm btn-ghost btn-active">主页</a>
        <a href="report.html" class="btn btn-sm btn-ghost">认知体检报告</a>
        <a href="bookshelf.html" class="btn btn-sm btn-ghost">平行书架</a>
        <a href="cooldown.html" class="btn btn-sm btn-ghost">冷静期盒子</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-col gap-8 px-4 py-8">
    <section class="card eatwhat-card bg-base-100">
      <div class="card-body gap-4">
        <div class="flex flex-wrap items-center gap-2 text-sm">
          <span class="badge eatwhat-badge-main badge-outline">MVP 三件套</span>
          <span class="badge badge-outline">不打扰</span>
          <span class="badge badge-outline">可解释</span>
          <span class="badge badge-outline">本地优先</span>
        </div>
        <h1 class="text-3xl font-semibold leading-tight text-base-content md:text-4xl">审视你的信息流，而不是被信息流推着走。</h1>
        <p class="max-w-3xl text-base text-base-content/75">
          问膳 EatWhat 帮你回看最近在 小红书接触到的内容，识别可能的思维盲区，并给出理性、可解释的平行视角。你始终掌握最终选择权。
        </p>
      </div>
    </section>

    <section class="grid grid-cols-1 gap-5 lg:grid-cols-3">
      <article class="card eatwhat-card border-l-4 border-l-[var(--eatwhat-main)] bg-base-100">
        <div class="card-body">
          <h2 class="card-title">📊 认知体检报告</h2>
          <p class="text-sm text-base-content/70">查看兴趣地图、观点倾向与盲区快照，理解这周内容摄入结构。</p>
          <div class="card-actions justify-end">
            <a href="report.html" class="btn eatwhat-btn-main" data-track-click="report-entry">进入报告</a>
          </div>
        </div>
      </article>

      <article class="card eatwhat-card border-l-4 border-l-[#3f6f94] bg-base-100">
        <div class="card-body">
          <h2 class="card-title">📚 平行书架</h2>
          <p class="text-sm text-base-content/70">针对盲区推荐对立或中立视角内容，并解释核心假设差异。</p>
          <div class="card-actions justify-end">
            <a href="bookshelf.html" class="btn btn-outline" data-track-click="bookshelf-entry">查看书架</a>
          </div>
        </div>
      </article>

      <article class="card eatwhat-card border-l-4 border-l-[var(--eatwhat-alert)] bg-base-100">
        <div class="card-body">
          <h2 class="card-title">⏳ 冷静期盒子</h2>
          <p class="text-sm text-base-content/70">把“想看但不想立刻看”的链接锁定 7 天，给判断留出缓冲空间。</p>
          <div class="card-actions justify-end">
            <a href="cooldown.html" class="btn btn-outline" data-track-click="cooldown-entry">打开盒子</a>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/logger.js"></script>
  <script>
    'use strict';

    window.addEventListener('DOMContentLoaded', function () {
      if (window.EatWhat && window.EatWhat.logger) {
        window.EatWhat.logger.log('frontend', 'INFO', '进入 Dashboard 主页', { page: '/' });
      }

      document.querySelectorAll('[data-track-click]').forEach(function (element) {
        element.addEventListener('click', function () {
          if (window.EatWhat && window.EatWhat.logger) {
            window.EatWhat.logger.log('frontend', 'INFO', '主页功能入口点击', {
              page: '/',
              entry: element.getAttribute('data-track-click')
            });
          }
        });
      });
    });
  </script>
</body>
</html>
