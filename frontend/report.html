<!DOCTYPE html>
<html lang="zh-CN" data-theme="pastel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EatWhat · 认知体检报告</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.13/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/css/eatwhat.css">
</head>
<body class="eatwhat-page">
  <header class="navbar border-b border-base-200 bg-base-100/95 px-4 shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between">
      <a class="btn btn-ghost px-1 text-xl font-semibold normal-case" href="/">
        <span class="text-2xl">🍽️</span>
        <span>问膳 EatWhat</span>
      </a>
      <nav class="hidden gap-2 md:flex">
        <a href="index.html" class="btn btn-sm btn-ghost">主页</a>
        <a href="report.html" class="btn btn-sm btn-ghost btn-active">认知体检报告</a>
        <a href="bookshelf.html" class="btn btn-sm btn-ghost">平行书架</a>
        <a href="cooldown.html" class="btn btn-sm btn-ghost">冷静期盒子</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-col gap-5 px-4 py-8">
    <section class="card eatwhat-card bg-base-100">
      <div class="card-body">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold md:text-3xl">认知体检报告</h1>
            <p class="text-sm text-base-content/70">兴趣地图 · 观点光谱 · 思维盲区 · 情绪共鸣模式</p>
          </div>
          <button id="report-generate-btn" class="btn eatwhat-btn-main">立即生成报告</button>
        </div>
      </div>
    </section>

    <div id="report-status" class="alert bg-[var(--eatwhat-highlight)] text-sm text-base-content/80">
      当前为骨架页：后端接口接好后将实时展示最新报告。
    </div>

    <section class="grid grid-cols-1 gap-5 xl:grid-cols-2">
      <article class="card eatwhat-card bg-base-100">
        <div class="card-body">
          <h2 class="card-title">兴趣地图（ECharts）</h2>
          <div id="interest-map" class="eatwhat-chart-placeholder">
            兴趣地图图表占位区域
          </div>
        </div>
      </article>

      <article class="card eatwhat-card bg-base-100">
        <div class="card-body">
          <h2 class="card-title">观点倾向光谱（ECharts）</h2>
          <div id="opinion-spectrum" class="eatwhat-chart-placeholder">
            观点光谱图表占位区域
          </div>
        </div>
      </article>

      <article class="card eatwhat-card bg-base-100 xl:col-span-2">
        <div class="card-body">
          <h2 class="card-title">思维盲区快照</h2>
          <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <div class="rounded-lg border border-dashed border-[var(--eatwhat-alert)] bg-white/70 p-4 text-sm text-base-content/80">
              占位：你这周可能忽略了哪些关键对立视角。
            </div>
            <div class="rounded-lg border border-dashed border-[var(--eatwhat-alert)] bg-white/70 p-4 text-sm text-base-content/80">
              占位：每条盲区将附带证据笔记引用。
            </div>
          </div>
        </div>
      </article>

      <article class="card eatwhat-card bg-base-100 xl:col-span-2">
        <div class="card-body">
          <h2 class="card-title">情绪共鸣模式</h2>
          <div class="rounded-lg border border-dashed border-base-300 bg-white/70 p-4 text-sm text-base-content/80">
            占位：这里会显示“焦虑/兴奋/愤怒”等高频情绪及对应样例内容。
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/logger.js"></script>
  <script>
    'use strict';

    window.addEventListener('DOMContentLoaded', function () {
      var api = window.EatWhat && window.EatWhat.api;
      var logger = window.EatWhat && window.EatWhat.logger;
      var generateButton = document.getElementById('report-generate-btn');
      var statusNode = document.getElementById('report-status');
      var reportSnapshot = {
        id: null,
        generatedAt: null
      };

      function setStatus(kind, message) {
        statusNode.className = 'alert text-sm text-base-content/80';
        if (kind === 'success') {
          statusNode.classList.add('bg-[#eafaf1]');
        } else if (kind === 'error') {
          statusNode.classList.add('bg-[#fdecea]');
        } else {
          statusNode.classList.add('bg-[var(--eatwhat-highlight)]');
        }
        statusNode.textContent = message;
      }

      function sleep(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      function updateSnapshot(report) {
        reportSnapshot.id = report ? report.id : null;
        reportSnapshot.generatedAt = report ? report.generated_at : null;
      }

      async function fetchLatestReport() {
        var result = await api.get('/api/report/latest');
        return result.data;
      }

      async function syncInitialSnapshot() {
        if (!api) {
          setStatus('error', '初始化失败：EatWhat.api 不可用');
          return;
        }

        var latest = await fetchLatestReport();
        updateSnapshot(latest);
        if (latest) {
          setStatus('info', '当前最新报告 #' + latest.id + '，生成时间：' + latest.generated_at);
          return;
        }
        setStatus('info', '当前暂无报告。点击“立即生成报告”后将自动轮询最新结果。');
      }

      async function handleGenerateClick() {
        if (!api) {
          setStatus('error', '请求失败：EatWhat.api 不可用');
          return;
        }

        var beforeId = reportSnapshot.id;
        var beforeGeneratedAt = reportSnapshot.generatedAt;
        generateButton.disabled = true;
        setStatus('info', '报告任务已触发，正在生成中（每 3 秒自动检查一次）…');

        if (logger) {
          logger.log('frontend', 'INFO', '点击生成报告', {
            page: '/report.html',
            before_report_id: beforeId
          });
        }

        try {
          await api.post('/api/report/generate');
          for (var i = 0; i < 20; i += 1) {
            await sleep(3000);
            var latest = await fetchLatestReport();
            if (
              latest &&
              (latest.id !== beforeId || latest.generated_at !== beforeGeneratedAt)
            ) {
              updateSnapshot(latest);
              setStatus('success', '报告已生成：#' + latest.id + '（' + latest.generated_at + '）');
              if (logger) {
                logger.log('frontend', 'INFO', '报告生成完成', {
                  page: '/report.html',
                  report_id: latest.id
                });
              }
              return;
            }
          }

          setStatus('error', '等待超时：报告仍在生成中，请稍后再试。');
          if (logger) {
            logger.log('frontend', 'WARN', '报告轮询超时', { page: '/report.html' });
          }
        } catch (error) {
          setStatus('error', '生成失败：' + error.message);
          if (logger) {
            logger.log('frontend', 'ERROR', '报告生成失败', {
              page: '/report.html',
              error: error.message
            });
          }
        } finally {
          generateButton.disabled = false;
        }
      }

      generateButton.addEventListener('click', handleGenerateClick);
      syncInitialSnapshot().catch(function (error) {
        setStatus('error', '初始化失败：' + error.message);
      });

      if (window.EatWhat && window.EatWhat.logger) {
        window.EatWhat.logger.log('frontend', 'INFO', '进入报告页', { page: '/report.html' });
      }
    });
  </script>
</body>
</html>
