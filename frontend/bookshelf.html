<!DOCTYPE html>
<html lang="zh-CN" data-theme="pastel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EatWhat · 平行书架</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.13/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/css/eatwhat.css">
</head>
<body class="eatwhat-page">
  <header class="navbar border-b border-base-200 bg-base-100/95 px-4 shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between">
      <a class="btn btn-ghost px-1 text-xl font-semibold normal-case" href="/">
        <span class="text-2xl">🍽️</span>
        <span>问膳 EatWhat</span>
      </a>
      <nav class="hidden gap-2 md:flex">
        <a href="index.html" class="btn btn-sm btn-ghost">主页</a>
        <a href="report.html" class="btn btn-sm btn-ghost">认知体检报告</a>
        <a href="bookshelf.html" class="btn btn-sm btn-ghost btn-active">平行书架</a>
        <a href="cooldown.html" class="btn btn-sm btn-ghost">冷静期盒子</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-col gap-5 px-4 py-8">
    <section class="card eatwhat-card bg-base-100">
      <div class="card-body">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold md:text-3xl">平行书架</h1>
            <p class="text-sm text-base-content/70">针对盲区推荐理性视角，解释“为什么有人会这样看问题”。</p>
          </div>
          <button id="bookshelf-refresh-btn" class="btn btn-outline">刷新书架</button>
        </div>
      </div>
    </section>

    <div id="bookshelf-status" class="alert bg-[var(--eatwhat-highlight)] text-sm text-base-content/80">
      当前为骨架页：将按 report_id 渲染推荐项列表。
    </div>

    <section id="bookshelf-list" class="grid grid-cols-1 gap-4">
      <article class="card eatwhat-card bg-base-100">
        <div class="card-body text-sm text-base-content/70">正在加载书架内容…</div>
      </article>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/logger.js"></script>
  <script src="/js/bookshelf.js"></script>
</body>
</html>
