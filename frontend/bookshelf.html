<!DOCTYPE html>
<html lang="zh-CN" data-theme="pastel">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EatWhat · 平行书架</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.13/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/css/eatwhat.css">
</head>
<body class="eatwhat-page">
  <header class="navbar border-b border-base-200 bg-base-100/95 px-4 shadow-sm">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between">
      <a class="btn btn-ghost px-1 text-xl font-semibold normal-case" href="/">
        <span class="text-2xl">🍽️</span>
        <span>问膳 EatWhat</span>
      </a>
      <nav class="hidden gap-2 md:flex">
        <a href="index.html" class="btn btn-sm btn-ghost">主页</a>
        <a href="report.html" class="btn btn-sm btn-ghost">认知体检报告</a>
        <a href="bookshelf.html" class="btn btn-sm btn-ghost btn-active">平行书架</a>
        <a href="cooldown.html" class="btn btn-sm btn-ghost">冷静期盒子</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-col gap-5 px-4 py-8">
    <section class="card eatwhat-card bg-base-100">
      <div class="card-body">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold md:text-3xl">平行书架</h1>
            <p class="text-sm text-base-content/70">针对盲区推荐理性视角，解释“为什么有人会这样看问题”。</p>
          </div>
          <button id="bookshelf-refresh-btn" class="btn btn-outline">刷新书架</button>
        </div>
      </div>
    </section>

    <div id="bookshelf-status" class="alert bg-[var(--eatwhat-highlight)] text-sm text-base-content/80">
      当前为骨架页：将按 report_id 渲染推荐项列表。
    </div>

    <section id="bookshelf-list" class="grid grid-cols-1 gap-4">
      <article class="card eatwhat-card bg-base-100" data-card-id="card-1">
        <div class="card-body gap-3">
          <div class="flex items-center justify-between gap-2">
            <h2 class="card-title text-lg">占位推荐条目 #1</h2>
            <span class="badge badge-outline">article</span>
          </div>
          <p class="text-sm text-base-content/75">这里会显示对立或中立视角的推荐内容标题、来源类型与 URL。</p>
          <div id="chat-context-card-1" class="rounded-md border border-[var(--eatwhat-main)]/30 bg-white/80 p-3 text-sm">
            差异对比卡片占位：与常看内容在核心假设上的不同点会显示在这里。
          </div>
          <div class="rounded-md border border-base-300 bg-white/80 p-3 text-sm">
            作者背景占位：展示作者/机构背景与研究方向，帮助用户判断可信度。
          </div>
          <div class="card-actions justify-end">
            <button class="btn btn-sm eatwhat-btn-main" data-chat-toggle data-card-id="card-1">苏格拉底追问</button>
          </div>
          <div id="chat-panel-card-1" class="hidden rounded-md border border-base-300 bg-white/80 p-3">
            <div id="chat-messages-card-1" class="mb-3 flex max-h-56 flex-col gap-2 overflow-y-auto text-sm"></div>
            <form class="flex gap-2" data-chat-form data-card-id="card-1">
              <input class="input input-bordered input-sm flex-1" name="message" placeholder="输入你想追问的问题" required>
              <button class="btn btn-sm eatwhat-btn-main" type="submit">发送</button>
            </form>
          </div>
        </div>
      </article>

      <article class="card eatwhat-card bg-base-100" data-card-id="card-2">
        <div class="card-body gap-3">
          <div class="flex items-center justify-between gap-2">
            <h2 class="card-title text-lg">占位推荐条目 #2</h2>
            <span class="badge badge-outline">podcast</span>
          </div>
          <p id="chat-context-card-2" class="text-sm text-base-content/75">后续将通过 `GET /api/bookshelf` 动态替换这部分内容。</p>
          <div class="card-actions justify-end">
            <button class="btn btn-sm eatwhat-btn-main" data-chat-toggle data-card-id="card-2">苏格拉底追问</button>
          </div>
          <div id="chat-panel-card-2" class="hidden rounded-md border border-base-300 bg-white/80 p-3">
            <div id="chat-messages-card-2" class="mb-3 flex max-h-56 flex-col gap-2 overflow-y-auto text-sm"></div>
            <form class="flex gap-2" data-chat-form data-card-id="card-2">
              <input class="input input-bordered input-sm flex-1" name="message" placeholder="输入你想追问的问题" required>
              <button class="btn btn-sm eatwhat-btn-main" type="submit">发送</button>
            </form>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/logger.js"></script>
  <script>
    'use strict';

    window.addEventListener('DOMContentLoaded', function () {
      var api = window.EatWhat && window.EatWhat.api;
      var logger = window.EatWhat && window.EatWhat.logger;
      var refreshButton = document.getElementById('bookshelf-refresh-btn');
      var statusNode = document.getElementById('bookshelf-status');
      var chatState = {};
      var bookshelfSnapshot = {
        fingerprint: 'empty',
        reportId: null,
        itemCount: 0
      };

      function setStatus(kind, message) {
        statusNode.className = 'alert text-sm text-base-content/80';
        if (kind === 'success') {
          statusNode.classList.add('bg-[#eafaf1]');
        } else if (kind === 'error') {
          statusNode.classList.add('bg-[#fdecea]');
        } else {
          statusNode.classList.add('bg-[var(--eatwhat-highlight)]');
        }
        statusNode.textContent = message;
      }

      function sleep(ms) {
        return new Promise(function (resolve) {
          setTimeout(resolve, ms);
        });
      }

      function createBookshelfFingerprint(data) {
        if (!data || !Array.isArray(data.items)) {
          return 'empty';
        }
        var latestCreatedAt = '';
        data.items.forEach(function (item) {
          if (item.created_at && item.created_at > latestCreatedAt) {
            latestCreatedAt = item.created_at;
          }
        });
        return String(data.report_id || '') + ':' + String(data.items.length) + ':' + latestCreatedAt;
      }

      function updateBookshelfSnapshot(data) {
        bookshelfSnapshot.fingerprint = createBookshelfFingerprint(data);
        bookshelfSnapshot.reportId = data && data.report_id ? data.report_id : null;
        bookshelfSnapshot.itemCount = data && Array.isArray(data.items) ? data.items.length : 0;
      }

      async function fetchBookshelf() {
        var result = await api.get('/api/bookshelf');
        return result.data;
      }

      async function syncInitialBookshelf() {
        if (!api) {
          setStatus('error', '初始化失败：EatWhat.api 不可用');
          return;
        }

        var data = await fetchBookshelf();
        updateBookshelfSnapshot(data);
        if (!data || !Array.isArray(data.items) || data.items.length === 0) {
          setStatus('info', '当前书架为空。点击“刷新书架”后将自动轮询最新结果。');
          return;
        }
        setStatus('info', '当前书架 report_id=' + data.report_id + '，共 ' + data.items.length + ' 条推荐。');
      }

      async function handleRefreshClick() {
        if (!api) {
          setStatus('error', '请求失败：EatWhat.api 不可用');
          return;
        }

        var beforeFingerprint = bookshelfSnapshot.fingerprint;
        var beforeReportId = bookshelfSnapshot.reportId;
        refreshButton.disabled = true;
        setStatus('info', '书架刷新任务已触发，正在处理中（每 3 秒自动检查一次）…');

        if (logger) {
          logger.log('frontend', 'INFO', '点击刷新书架', {
            page: '/bookshelf.html',
            before_report_id: beforeReportId
          });
        }

        try {
          await api.post('/api/bookshelf/refresh');
          for (var i = 0; i < 20; i += 1) {
            await sleep(3000);
            var latest = await fetchBookshelf();
            var latestFingerprint = createBookshelfFingerprint(latest);
            if (latestFingerprint !== beforeFingerprint) {
              updateBookshelfSnapshot(latest);
               setStatus(
                'success',
                '书架已更新：report_id=' + (latest.report_id || '-') + '，共 ' + latest.items.length + ' 条推荐。'
              );
              if (logger) {
                logger.log('frontend', 'INFO', '书架刷新完成', {
                  page: '/bookshelf.html',
                  report_id: latest.report_id,
                  item_count: latest.items.length
                });
              }
              return;
            }
          }

          setStatus('error', '等待超时：书架仍在刷新中，请稍后再试。');
          if (logger) {
            logger.log('frontend', 'WARN', '书架轮询超时', { page: '/bookshelf.html' });
          }
        } catch (error) {
          setStatus('error', '刷新失败：' + error.message);
          if (logger) {
            logger.log('frontend', 'ERROR', '书架刷新失败', {
              page: '/bookshelf.html',
              error: error.message
            });
          }
        } finally {
          refreshButton.disabled = false;
        }
      }

      function getState(cardId) {
        if (!chatState[cardId]) {
          chatState[cardId] = {
            sessionId: null,
            context: ''
          };
        }
        return chatState[cardId];
      }

      function appendChatMessage(cardId, role, message) {
        var list = document.getElementById('chat-messages-' + cardId);
        var item = document.createElement('div');
        item.className = 'rounded-md px-3 py-2 text-sm';
        item.style.maxWidth = '85%';
        item.style.wordBreak = 'break-word';
        if (role === 'user') {
          item.style.marginLeft = 'auto';
          item.style.backgroundColor = '#dcfce7';
          item.style.color = '#14532d';
          item.style.border = '1px solid #86efac';
          item.textContent = '我：' + message;
        } else {
          item.style.marginRight = 'auto';
          item.style.backgroundColor = '#eef2f7';
          item.style.color = '#1f2937';
          item.style.border = '1px solid #d1d5db';
          item.textContent = '问膳：' + message;
        }
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
      }

      function resetCardChat(cardId) {
        var list = document.getElementById('chat-messages-' + cardId);
        var contextNode = document.getElementById('chat-context-' + cardId);
        var state = getState(cardId);
        state.sessionId = null;
        state.context = contextNode ? contextNode.textContent.trim() : '';
        list.innerHTML = '';
        appendChatMessage(cardId, 'assistant', '你好，我会基于这张卡片继续追问你。');
      }

      async function sendChat(cardId, message) {
        var state = getState(cardId);
        var body = {
          message: message,
          session_id: state.sessionId
        };
        if (state.context && !state.sessionId) {
          body.context = state.context;
        }
        var response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        var result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error((result && result.error) || ('请求失败: HTTP ' + response.status));
        }
        state.sessionId = result.data.session_id;
        return result.data.reply;
      }

      document.querySelectorAll('[data-chat-toggle]').forEach(function (button) {
        button.addEventListener('click', function () {
          var cardId = button.getAttribute('data-card-id');
          var panel = document.getElementById('chat-panel-' + cardId);
          var shouldOpen = panel.classList.contains('hidden');
          panel.classList.toggle('hidden');
          if (shouldOpen) {
            resetCardChat(cardId);
          }
        });
      });

      document.querySelectorAll('[data-chat-form]').forEach(function (form) {
        form.addEventListener('submit', async function (event) {
          event.preventDefault();
          var cardId = form.getAttribute('data-card-id');
          var input = form.querySelector('input[name="message"]');
          var text = input.value.trim();
          if (!text) {
            return;
          }
          input.value = '';
          appendChatMessage(cardId, 'user', text);
          try {
            var reply = await sendChat(cardId, text);
            appendChatMessage(cardId, 'assistant', reply);
          } catch (error) {
            appendChatMessage(cardId, 'assistant', '请求失败：' + error.message);
          }
        });
      });

      refreshButton.addEventListener('click', handleRefreshClick);
      syncInitialBookshelf().catch(function (error) {
        setStatus('error', '初始化失败：' + error.message);
      });

      if (window.EatWhat && window.EatWhat.logger) {
        window.EatWhat.logger.log('frontend', 'INFO', '进入平行书架页', { page: '/bookshelf.html' });
      }
    });
  </script>
</body>
</html>
